<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>rough.js style guide — y=x^2</title>
  <style>
    :root{
      --ink:#1b1f24; --muted:#5b6472; --accent:#00369f;
      --card: rgba(255,255,255,0.75);
      --border: rgba(27,31,36,0.10);
    }
    body{ font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 28px; color: var(--ink); background: #f7f9fc; }
    h1{ font-size: 22px; margin: 0 0 8px; }
    p{ margin: 0 0 18px; color: var(--muted); }
    .grid{ display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
    .card{ background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px; backdrop-filter: blur(4px); }
    .title{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:10px; }
    .title h2{ font-size: 15px; margin:0; }
    .title code{ color: var(--muted); font-size: 12px; }
    svg{ width: 100%; height: 240px; display:block; }
  </style>
</head>
<body>
  <h1>rough.js style guide — y = x²</h1>
  <p>Each panel draws axes + <strong>y = x²</strong> with different roughness settings.</p>

  <div class="grid" id="grid"></div>

  <script type="module">
    import rough from 'https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.esm.js';

    const styles = [
      { name: 'clean sketch', opts: { roughness: 0.8, bowing: 0.8, strokeWidth: 2.0 } },
      { name: 'rougher ink', opts: { roughness: 1.6, bowing: 1.6, strokeWidth: 2.2 } },
      { name: 'pencil',     opts: { roughness: 1.1, bowing: 1.1, strokeWidth: 1.6, stroke: '#2a2f36' } },
      { name: 'blueprint',  opts: { roughness: 1.0, bowing: 0.9, strokeWidth: 1.9, stroke: '#00369f' } },
      { name: 'marker',     opts: { roughness: 1.3, bowing: 1.0, strokeWidth: 3.0, stroke: '#1b1f24' } },
      { name: 'lofi',       opts: { roughness: 2.2, bowing: 2.0, strokeWidth: 2.0 } },
    ];

    function addCard({name, opts}){
      const grid = document.getElementById('grid');
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="title">
          <h2>${name}</h2>
          <code>${JSON.stringify(opts)}</code>
        </div>
        <svg viewBox="0 0 420 260" role="img" aria-label="${name}"></svg>
      `;
      grid.appendChild(card);
      const svg = card.querySelector('svg');
      const rc = rough.svg(svg);

      // axes box
      const padL=44, padB=34, padT=16, padR=14;
      const x0=padL, y0=260-padB, x1=420-padR, y1=padT;

      const axis = { ...opts, stroke: opts.stroke || '#1b1f24' };
      svg.appendChild(rc.line(x0, y0, x1, y0, axis));
      svg.appendChild(rc.line(x0, y0, x0, y1, axis));

      // ticks
      for(let i=0;i<=6;i++){
        const tx = x0 + (x1-x0)*i/6;
        svg.appendChild(rc.line(tx, y0, tx, y0+6, { ...axis, strokeWidth: 1.2 }));
      }
      for(let i=0;i<=5;i++){
        const ty = y0 - (y0-y1)*i/5;
        svg.appendChild(rc.line(x0-6, ty, x0, ty, { ...axis, strokeWidth: 1.2 }));
      }

      // curve y=x^2 mapped from x∈[-3,3] to plot window
      const pts=[];
      for(let i=0;i<=160;i++){
        const x = -3 + 6*i/160;
        const y = x*x;
        const px = x0 + (x+3)/6*(x1-x0);
        const py = y0 - (y/9.5)*(y0-y1);
        pts.push([px,py]);
      }

      svg.appendChild(rc.curve(pts, { ...opts, stroke: opts.stroke || '#00369f', strokeWidth: opts.strokeWidth || 2.2 }));

      // label
      const text = document.createElementNS('http://www.w3.org/2000/svg','text');
      text.setAttribute('x', x0+8);
      text.setAttribute('y', y1+16);
      text.setAttribute('fill', '#5b6472');
      text.setAttribute('font-size', '12');
      text.textContent = 'y = x²';
      svg.appendChild(text);
    }

    styles.forEach(addCard);
  </script>
</body>
</html>
